name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。完整的复现步骤和截图会显著加快定位速度。
  - type: input
    id: version
    attributes:
      label: MOTZ 版本
      placeholder: 例如 0.3.81
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 使用版本
      options:
        - 安装版
        - 便携版
        - 浏览器插件
        - 源码开发版
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 系统环境与补充信息
      placeholder: Windows 版本、屏幕缩放、素材类型、截图或录屏
