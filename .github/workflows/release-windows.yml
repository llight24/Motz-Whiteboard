name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN_WINDOWS: ${{ secrets.WIN_CSC_LINK != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run package:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build portable package
        run: npm run package:win:portable
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $extensionVersion = node -p "require('./browser-extension/manifest.json').version"
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item "release/MOTZ白板-Setup-$version-x64.exe" "publish/MOTZ-Whiteboard-Setup-$version-x64.exe"
          Copy-Item "release/MOTZ白板-Portable-$version-x64.exe" "publish/MOTZ-Whiteboard-Portable-$version-x64.exe"
          $extensionFiles = Get-ChildItem browser-extension -Force
          Compress-Archive -Path $extensionFiles.FullName -DestinationPath "publish/MOTZ-browser-extension-$extensionVersion.zip" -Force
          Get-ChildItem publish -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding utf8 "publish/SHA256SUMS-$version.txt"

      - name: Verify Windows signatures
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          $executables = Get-ChildItem publish -Filter *.exe
          $invalid = @($executables | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne "Valid" })
          if ($invalid.Count -gt 0) {
            $invalid | ForEach-Object { Write-Error "Invalid signature: $($_.Name)" }
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MOTZ-Windows-${{ github.ref_name }}
          path: publish/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = ".github/release-notes/$tag.md"
          $assets = (Get-ChildItem publish -File).FullName
          if (Test-Path $notes) {
            gh release create $tag @assets --title "MOTZ 白板 $tag" --notes-file $notes
          } else {
            gh release create $tag @assets --title "MOTZ 白板 $tag" --generate-notes
          }
